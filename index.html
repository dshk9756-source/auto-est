<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>견적 시스템</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<header>
  <div class="h-brand">
    <div class="h-logo">OPEN<span>WORKS</span></div>
    <div class="h-sep"></div>
    <div class="h-sub">스마트 안전관리 솔루션</div>
  </div>
  <div class="h-nav">
    <button class="h-tab on" onclick="showView('a',this)">견적 작성</button>
    <button class="h-tab" onclick="showView('b',this)">견적 이력 <span id="hist-cnt" style="font-family:var(--mono);font-size:9px;color:var(--sig);margin-left:4px"></span></button>
  </div>
</header>

<div class="view on" id="va">
  <div class="lp">
    <div class="lp-head">
      <div class="stepbar">
        <div class="si active" id="step1">
          <div class="sdot"><span class="sdot-n">01</span><svg class="sdot-ok" viewBox="0 0 10 10" width="10" height="10" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,8 8.5,2"/></svg></div>
          <span class="sl">현장 정보</span>
        </div>
        <div class="sline"></div>
        <div class="si" id="step2">
          <div class="sdot"><span class="sdot-n">02</span><svg class="sdot-ok" viewBox="0 0 10 10" width="10" height="10" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,8 8.5,2"/></svg></div>
          <span class="sl">품목 선택</span>
        </div>
        <div class="sline"></div>
        <div class="si" id="step3">
          <div class="sdot"><span class="sdot-n">03</span><svg class="sdot-ok" viewBox="0 0 10 10" width="10" height="10" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,8 8.5,2"/></svg></div>
          <span class="sl">저장 · 출력</span>
        </div>
      </div>
    </div>
    <div class="lp-scroll">
      <div class="sh"><div class="sh-n">01</div>현장 · 거래처 정보</div>
      <div class="fg full" style="margin-bottom:12px">
        <label>템플릿 선택</label>
        <div id="tpl-list" class="tpl-list"></div>
      </div>
      <div class="ig" style="grid-template-columns:1fr 1fr 0.75fr 1fr">
        <div class="fg"><label>건설사</label><input id="f-company" placeholder="예: (주)대우건설" oninput="syncSteps()"></div>
        <div class="fg"><label>현장명</label><input id="f-sitename" placeholder="예: 평택오송 1공구" oninput="syncSteps()"></div>
        <div class="fg"><label>현장 담당자</label><input id="f-manager" placeholder="홍길동 과장"></div>
        <div class="fg"><label>견적서명</label><input id="f-site" placeholder="스마트 안전관리 솔루션"></div>
        <input type="hidden" id="f-contact" value="">
        <input type="hidden" id="f-date">
        <input type="hidden" id="f-valid" value="30일">
        <div class="fg full">
          <label>특기사항 <span style="font-size:10px;color:var(--text3);font-weight:400;letter-spacing:0;text-transform:none">— 견적서 하단에 출력됩니다</span></label>
          <div id="note-list"></div>
          <button class="note-add-btn" onclick="addNote()">+ 특기사항 추가</button>
        </div>
      </div>

      <div class="sh"><div class="sh-n">02</div>품목 카탈로그</div>
      <div class="ctabs" id="cat-tabs"></div>
      <div id="tab-sets"><div class="cg" id="set-grid"></div></div>
      <div id="tab-smart" style="display:none"><div class="cg" id="smart-grid"></div></div>
      <div id="tab-items" style="display:none">
        <div class="sbar">
          <input class="si-in" id="item-q" placeholder="품목명 · 사양 검색..." oninput="filterItems()">
          <select class="si-sel" id="item-cat" onchange="filterItems()"><option value="">전체</option></select>
        </div>
        <div class="cg" id="item-grid"></div>
      </div>
    </div>
  </div>

  <div class="rp">
    <div class="rp-head">
      <div><div class="rp-title">견적 구성</div><div class="rp-meta" id="rp-meta">항목을 선택하세요</div></div>
      <button class="rp-clr" onclick="clearCart()">초기화</button>
    </div>
    <div class="cart-scroll" id="cart-scroll" ondragover="onCartDragOver(event)" ondragleave="onCartDragLeave(event)" ondrop="onCartDrop(event)">
      <div class="cart-empty"><svg viewBox="0 0 44 44"><rect x="4" y="12" width="36" height="26" rx="3"/><path d="M14 12V8a8 8 0 0116 0v4"/><circle cx="16" cy="25" r="2"/><circle cx="28" cy="25" r="2"/></svg><p>세트 패키지 또는 단품을<br>선택하면 여기에 담깁니다<br><br><span style="font-family:var(--mono);font-size:12px;color:var(--mist2)">단가는 직접 수정 가능합니다</span></p></div>
    </div>
    <div class="totals">
      <div class="tr-row"><span class="tr-lbl">공급가액</span><span class="tr-val" id="t-supply">—</span></div>
      <div class="tr-row"><span class="tr-lbl">부가세 10%</span><span class="tr-val" id="t-vat">—</span></div>
      <div class="tr-div"></div>
      <div class="tr-grand"><span class="tg-lbl">TOTAL</span><span class="tg-val" id="t-total">—</span></div>
      <div class="tr-note">단가 수정 시 자동 반영 · 별도협의 제외</div>
      <div class="markup-row" id="markup-row" style="display:none">
        <span class="markup-lbl">단가 일괄 조정</span>
        <div class="markup-controls">
          <input type="text" id="markup-pct" class="markup-input" placeholder="%" value="10">
          <span class="markup-unit">%</span>
          <button class="markup-btn up" onclick="applyMarkup(1)">인상</button>
          <button class="markup-btn down" onclick="applyMarkup(-1)">인하</button>
        </div>
        <div class="markup-opt">
          <label><input type="checkbox" id="markup-round" checked> 만원 단위 반올림</label>
        </div>
      </div>
      <button class="preview-btn" id="preview-btn" onclick="previewExcel()" disabled>미리보기</button>
      <button class="excel-btn" id="excel-btn" onclick="generateExcel()" disabled>엑셀 다운로드</button>
      <button class="purchase-btn" id="purchase-btn" onclick="openPurchaseModal()" disabled>구매요청서</button>
      <button class="save-btn" id="save-btn" onclick="saveQuote()" disabled>이력에 저장</button>
    </div>
  </div>
</div>

<div class="view" id="vb">
  <div class="vb-inner">
    <div class="vb-toolbar">
      <div class="vb-tl">견적 이력</div>
      <div class="vb-filters">
        <button class="vb-flt on" onclick="filterHist('all',this)">전체</button>
        <button class="vb-flt" onclick="filterHist('review',this)">검토중</button>
        <button class="vb-flt" onclick="filterHist('active',this)">진행중</button>
        <button class="vb-flt" onclick="filterHist('done',this)">완료</button>
        <button class="vb-flt" onclick="filterHist('cancel',this)">취소</button>
      </div>
    </div>
    <div id="hist-body"></div>
  </div>
</div>
</div>

<!-- 미리보기 모달 -->
<div class="pv-overlay" id="pv-overlay" onclick="closePreview()">
  <div class="pv-modal" onclick="event.stopPropagation()">
    <div class="pv-header">
      <div class="pv-title">견적서 미리보기</div>
      <div class="pv-tabs" id="pv-tabs"></div>
      <button class="pv-close" onclick="closePreview()">&times;</button>
    </div>
    <div class="pv-body" id="pv-body">
      <div class="pv-loading" id="pv-loading">생성 중...</div>
    </div>
  </div>
</div>

<!-- 구매요청서 모달 -->
<div class="pr-overlay" id="pr-overlay" onclick="closePurchaseModal()">
  <div class="pr-modal" onclick="event.stopPropagation()">
    <div class="pr-header">
      <div class="pr-title">구매요청서</div>
      <button class="pv-close" onclick="closePurchaseModal()">&times;</button>
    </div>
    <div class="pr-info">
      <div class="pr-info-row">
        <div class="fg"><label>신청인</label><input type="text" id="pr-applicant" placeholder="이름 입력"></div>
      </div>
    </div>
    <div class="pr-body" id="pr-body"></div>
    <div class="pr-footer">
      <div class="pr-count" id="pr-count"></div>
      <button class="excel-btn" id="pr-download-btn" onclick="downloadPurchaseRequest()">구매요청서 다운로드</button>
    </div>
  </div>
</div>

  <!-- SheetJS: 엑셀(catalog.xlsx) 파싱. 없으면 data/catalog.json 사용 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
