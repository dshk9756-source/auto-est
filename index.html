<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>견적 시스템</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<header>
  <div class="h-brand">
    <div class="h-logo">OPEN<span>WORKS</span></div>
    <div class="h-sep"></div>
    <div class="h-sub">스마트 안전관리 솔루션</div>
  </div>
  <div class="h-nav">
    <button class="h-tab on" onclick="showView('a',this)">견적 작성</button>
    <button class="h-tab" onclick="showView('b',this)">견적 이력 <span id="hist-cnt" style="font-family:var(--mono);font-size:9px;color:var(--sig);margin-left:4px"></span></button>
  </div>
</header>

<div class="view on" id="va">
  <div class="lp">
    <div class="lp-head">
      <div class="stepbar">
        <div class="si active" id="step1">
          <div class="sdot"><span class="sdot-n">01</span><svg class="sdot-ok" viewBox="0 0 10 10" width="10" height="10" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,8 8.5,2"/></svg></div>
          <span class="sl">현장 정보</span>
        </div>
        <div class="sline"></div>
        <div class="si" id="step2">
          <div class="sdot"><span class="sdot-n">02</span><svg class="sdot-ok" viewBox="0 0 10 10" width="10" height="10" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,8 8.5,2"/></svg></div>
          <span class="sl">품목 선택</span>
        </div>
        <div class="sline"></div>
        <div class="si" id="step3">
          <div class="sdot"><span class="sdot-n">03</span><svg class="sdot-ok" viewBox="0 0 10 10" width="10" height="10" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,5 4,8 8.5,2"/></svg></div>
          <span class="sl">저장 · 출력</span>
        </div>
      </div>
    </div>
    <div class="lp-scroll">
      <div class="sh"><div class="sh-n">01</div>현장 · 거래처 정보</div>
      <div class="fg full" style="margin-bottom:12px">
        <label>템플릿 선택</label>
        <div id="tpl-list" class="tpl-list"></div>
      </div>
      <div class="ig">
        <div class="fg span2"><label>거래처명 / 현장명</label><input id="f-client" placeholder="예: (주)대우건설 평택오송 1공구" oninput="syncSteps()"></div>
        <input type="hidden" id="f-site" value="스마트 안전관리 솔루션">
        <div class="fg"><label>담당자</label><input id="f-manager" placeholder="홍길동 과장"></div>
        <input type="hidden" id="f-contact" value="">
        <input type="hidden" id="f-date">
        <input type="hidden" id="f-valid" value="30일">
        <div class="fg full">
          <label>특기사항 (추가 입력)</label>
          <div id="note-list"></div>
          <button class="note-add-btn" onclick="addNote()">+ 특기사항 추가</button>
        </div>
      </div>

      <div class="sh"><div class="sh-n">02</div>품목 카탈로그</div>
      <div class="ctabs" id="cat-tabs"></div>
      <div id="tab-sets"><div class="cg" id="set-grid"></div></div>
      <div id="tab-items" style="display:none">
        <div class="sbar">
          <input class="si-in" id="item-q" placeholder="품목명 · 사양 검색..." oninput="filterItems()">
          <select class="si-sel" id="item-cat" onchange="filterItems()"><option value="">전체</option></select>
        </div>
        <div class="cg" id="item-grid"></div>
      </div>
    </div>
  </div>

  <div class="rp">
    <div class="rp-head">
      <div><div class="rp-title">견적 구성</div><div class="rp-meta" id="rp-meta">항목을 선택하세요</div></div>
      <button class="rp-clr" onclick="clearCart()">초기화</button>
    </div>
    <div class="cart-scroll" id="cart-scroll" ondragover="onCartDragOver(event)" ondragleave="onCartDragLeave(event)" ondrop="onCartDrop(event)">
      <div class="cart-empty"><svg viewBox="0 0 44 44"><rect x="4" y="12" width="36" height="26" rx="3"/><path d="M14 12V8a8 8 0 0116 0v4"/><circle cx="16" cy="25" r="2"/><circle cx="28" cy="25" r="2"/></svg><p>세트 패키지 또는 단품을<br>선택하면 여기에 담깁니다<br><br><span style="font-family:var(--mono);font-size:9px;color:var(--mist2)">단가는 직접 수정 가능합니다</span></p></div>
    </div>
    <div class="totals">
      <div class="tr-row"><span class="tr-lbl">공급가액</span><span class="tr-val" id="t-supply">—</span></div>
      <div class="tr-row"><span class="tr-lbl">부가세 10%</span><span class="tr-val" id="t-vat">—</span></div>
      <div class="tr-div"></div>
      <div class="tr-grand"><span class="tg-lbl">TOTAL</span><span class="tg-val" id="t-total">—</span></div>
      <div class="tr-note">단가 수정 시 자동 반영 · 별도협의 제외</div>
      <button class="excel-btn" id="excel-btn" onclick="generateExcel()" disabled>엑셀 다운로드</button>
      <button class="save-btn" id="save-btn" onclick="saveQuote()" disabled>이력에 저장</button>
    </div>
  </div>
</div>

<div class="view" id="vb">
  <div class="vb-inner">
    <div class="vb-toolbar">
      <div class="vb-tl">견적 이력</div>
      <div class="vb-filters">
        <button class="vb-flt on" onclick="filterHist('all',this)">전체</button>
        <button class="vb-flt" onclick="filterHist('review',this)">검토중</button>
        <button class="vb-flt" onclick="filterHist('active',this)">진행중</button>
        <button class="vb-flt" onclick="filterHist('done',this)">완료</button>
        <button class="vb-flt" onclick="filterHist('cancel',this)">취소</button>
      </div>
    </div>
    <div id="hist-body"></div>
  </div>
</div>
</div>

  <div id="app"></div>

  <!-- SheetJS: 엑셀(catalog.xlsx) 파싱. 없으면 data/catalog.json 사용 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
